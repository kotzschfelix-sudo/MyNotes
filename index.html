<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11121a"><meta name="description" content="MyNotes – deine Gedanken, Ideen und Notizen an einem Ort.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icons/mynotes.svg">
<title>MyNotes – Notizen</title>
<style>
:root{color-scheme:dark;--bg:#101118;--panel:#191b26;--panel2:#202331;--text:#f4f4f8;--muted:#9699aa;--line:#2b2e3d;--accent:#9b83ff;--soft:#30284e;--good:#65d6a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.sidebar{background:#14151e;border-right:1px solid var(--line);padding:24px 16px;position:relative}.brand{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:760;margin:0 8px 34px}.logo{width:40px;height:40px}.nav{display:grid;gap:6px}.nav button{border:0;background:none;color:var(--muted);text-align:left;padding:11px 13px;border-radius:10px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.folder-head{display:flex;align-items:center;margin:27px 8px 9px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.folder-head button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:19px}.folders{display:grid;gap:3px}.folders button{border:0;background:none;color:var(--muted);text-align:left;padding:8px 12px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folders button.active,.folders button:hover{background:var(--panel2);color:var(--text)}.side-bottom{position:absolute;bottom:20px;left:25px;color:var(--muted);font-size:12px}
.main{width:100%;max-width:1440px;margin:auto;padding:34px clamp(18px,4vw,52px)}.top{display:flex;align-items:center;gap:14px;margin-bottom:25px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em}.top h1{font-size:29px;margin:3px 0;font-weight:740}.spacer{flex:1}.primary{background:var(--accent);color:#11111a;border:0;border-radius:10px;padding:11px 16px;font-weight:720}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 14px}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input,.toolbar select,.field input,.field textarea,.field select,.folder-input{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}.toolbar input{max-width:460px}.toolbar select{max-width:190px}.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.note{min-height:190px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,transform .15s}.note:hover{border-color:var(--accent);transform:translateY(-2px)}.note h2{font-size:16px;margin:0 0 9px;overflow-wrap:anywhere}.note p{color:#b7b9c6;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.note-meta{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:15px;color:var(--muted);font-size:12px}.tag{background:var(--soft);color:#c5b8ff;padding:3px 8px;border-radius:20px}.pin{margin-left:auto;color:#c5b8ff}.empty{border:1px dashed var(--line);border-radius:15px;padding:55px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}.user{font-size:12px;color:var(--muted);margin:12px 8px 0;overflow-wrap:anywhere}.user button{display:block;margin-top:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 10px;border-radius:8px}
.modal{position:fixed;inset:0;z-index:10;background:#000a;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(760px,100%);max-height:min(90vh,900px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 25px 80px #0008}.dialog-top{display:flex;align-items:center;gap:10px;margin-bottom:15px}.dialog-top h2{font-size:19px;margin:0}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field textarea{resize:vertical;min-height:300px;line-height:1.65}.field input{font-size:17px;font-weight:650}.editor-row{display:grid;grid-template-columns:1fr auto;gap:10px}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.check input{accent-color:var(--accent)}.actions{display:flex;align-items:center;gap:9px;margin-top:18px}.danger{border:1px solid #67363c;background:#382329;color:#ffb5bc;border-radius:9px;padding:9px 12px}.auth-screen{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#30284e 0%,#101118 60%)}.auth-required .auth-screen{display:grid}.auth-required .app{display:none}.auth-card{width:min(420px,100%);padding:28px;background:var(--panel);border:1px solid #383448;border-radius:20px;box-shadow:0 24px 80px #0008}.auth-brand{display:flex;align-items:center;justify-content:center;gap:12px;font-size:25px;font-weight:760;margin-bottom:22px}.auth-brand img{width:62px}.auth-card h1{font-size:21px;margin:0 0 5px}.auth-sub{color:var(--muted);font-size:13px;margin:0 0 20px}.auth-field{margin:13px 0}.auth-field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.auth-field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px}.auth-actions{display:grid;gap:9px;margin-top:18px}.auth-link{border:0;background:none;color:#b9aaff;padding:8px}.auth-error{color:#ff9292;font-size:13px;margin-top:10px}.auth-info{color:#a9e5c8;font-size:13px;margin-top:10px}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:3;padding:10px 13px;border:0;border-bottom:1px solid var(--line)}.brand{margin:0 5px 7px;font-size:18px}.logo{width:31px;height:31px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px}.folder-head,.folders,.side-bottom{display:none}.user{display:flex;align-items:center;gap:8px;margin:8px 5px 0}.user button{margin:0 0 0 auto}.main{padding:23px 15px}.top h1{font-size:25px}}
@media(max-width:520px){.toolbar{flex-wrap:wrap}.toolbar input,.toolbar select{max-width:none}.notes{grid-template-columns:1fr}.note{min-height:155px}.editor-row{grid-template-columns:1fr}.field textarea{min-height:240px}}
</style>
</head>
<body class="auth-required">
<div class="auth-screen"><form class="auth-card" id="authForm"><div class="auth-brand"><img src="./icons/mynotes.svg" alt="">MyNotes</div><h1 id="authTitle">Bei MyDigital anmelden</h1><p class="auth-sub" id="authSubtitle">Nutze dein bestehendes MyDigital-Konto.</p><div id="registerFields" hidden class="auth-field"><label for="username">Benutzername</label><input id="username" autocomplete="username" minlength="3" maxlength="20" placeholder="z. B. felix_123"></div><div class="auth-field" id="emailField"><label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="email" required placeholder="name@beispiel.de"></div><div class="auth-field" id="passwordField"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="Mindestens 8 Zeichen"></div><div id="authMessage" aria-live="polite"></div><div class="auth-actions"><button class="primary" id="authSubmit">Anmelden</button><button class="auth-link" id="authToggle" type="button">Noch kein Konto? Registrieren</button><button class="auth-link" id="authReset" type="button">Passwort vergessen?</button></div></form></div>
<div class="app"><aside class="sidebar"><div class="brand"><img class="logo" src="./icons/mynotes.svg" alt="">MyNotes</div><nav class="nav" id="nav"><button class="active" data-view="all">▤ &nbsp; Alle Notizen</button><button data-view="pinned">☆ &nbsp; Angepinnt</button><button id="dashboard">⌂ &nbsp; Dashboard</button></nav><div class="folder-head">Ordner <button id="addFolder" title="Ordner hinzufügen">＋</button></div><div class="folders" id="folders"></div><div class="side-bottom">Teil von MyDigital</div><div class="user" id="userBox"></div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">MYDIGITAL / MYNOTES</div><h1 id="heading">Alle Notizen</h1></div><div class="spacer"></div><button class="primary" id="newNote">＋ Neue Notiz</button></header><div class="toolbar"><input id="search" type="search" placeholder="Notizen durchsuchen …" aria-label="Notizen durchsuchen"><select id="sort" aria-label="Sortierung"><option value="updated">Zuletzt bearbeitet</option><option value="created">Zuletzt erstellt</option><option value="title">Titel A–Z</option></select></div><section class="notes" id="notes"></section></main></div>
<div class="modal" id="editor"><form class="dialog" id="noteForm"><div class="dialog-top"><h2 id="editorTitle">Neue Notiz</h2><div class="spacer"></div><button type="button" class="secondary" id="closeEditor">Schließen</button></div><div class="field"><label for="noteTitle">Titel</label><input id="noteTitle" maxlength="120" placeholder="Titel deiner Notiz" required></div><div class="editor-row"><div class="field"><label for="noteFolder">Ordner</label><select id="noteFolder"></select></div><label class="check" style="align-self:end;padding:12px 0"><input id="notePinned" type="checkbox"> Anpinnen</label></div><div class="field"><label for="noteContent">Inhalt</label><textarea id="noteContent" placeholder="Schreibe deine Gedanken auf …"></textarea></div><div class="actions"><button type="button" class="danger" id="deleteNote" style="display:none;margin-right:auto">Löschen</button><button type="button" class="secondary" id="cancelEditor">Abbrechen</button><button class="primary" type="submit">Speichern</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://pmlcstqpmmoiqnvfxspl.supabase.co';
const SUPABASE_KEY='sb_publishable_kx4UGLboJuhwN6P3JcbNZg_-39zZoZV';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,notes=[],folders=['Allgemein','Privat','Arbeit','Ideen'],view='all',activeFolder='all',editingId=null,authMode='login',busy=false;
const dateLabel=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'short',year:'numeric'}).format(d)};
function message(t,type='error'){$('#authMessage').className=type==='info'?'auth-info':'auth-error';$('#authMessage').textContent=t||''}
function authUI(){const reg=authMode==='register',reset=authMode==='reset';$('#authTitle').textContent=reg?'MyDigital-Konto erstellen':reset?'Passwort zurücksetzen':'Bei MyDigital anmelden';$('#authSubtitle').textContent=reg?'Erstelle ein Konto für alle MyDigital-Apps.':'Nutze dein bestehendes MyDigital-Konto.';$('#registerFields').hidden=!reg;$('#emailField').hidden=false;$('#passwordField').hidden=reset;$('#password').required=!reset;$('#authSubmit').textContent=reg?'Konto erstellen':reset?'Reset-Link senden':'Anmelden';$('#authToggle').hidden=reset;$('#authReset').hidden=reg||reset}
$('#authToggle').onclick=()=>{authMode=authMode==='login'?'register':'login';message('');authUI()};$('#authReset').onclick=()=>{authMode='reset';message('');authUI()};
$('#authForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('#authSubmit').disabled=true;message('');try{const email=$('#email').value.trim(),password=$('#password').value;if(authMode==='register'){const username=$('#username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(username))throw new Error('Benutzername: 3–20 Zeichen, nur a–z, 0–9 und _.');const{data,error}=await db.auth.signUp({email,password,options:{data:{username},emailRedirectTo:location.href.split('#')[0]}});if(error)throw error;if(!data.session){authMode='login';authUI();message('Bitte bestätige zuerst deine E-Mail-Adresse. Danach kannst du dich anmelden.','info')}}else if(authMode==='reset'){const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(error)throw error;message('Wenn die Adresse bekannt ist, erhältst du eine E-Mail mit einem Link.','info')}else{const{error}=await db.auth.signInWithPassword({email,password});if(error)throw error}}catch(err){const m=err.message||'Anmeldung fehlgeschlagen.';message(/Invalid login/i.test(m)?'E-Mail oder Passwort ist falsch.':/already registered/i.test(m)?'Diese E-Mail ist bereits registriert.':m)}finally{busy=false;$('#authSubmit').disabled=false}};
async function loadNotes(){const{data,error}=await db.from('notes').select('id,owner,title,content,folder,pinned,created_at,updated_at').eq('owner',user.id).order('updated_at',{ascending:false});if(error)throw error;notes=data||[];folders=[...new Set([...folders,...notes.map(n=>n.folder).filter(Boolean)])];render()}
function render(){const q=$('#search').value.trim().toLowerCase(),sort=$('#sort').value;let list=notes.filter(n=>(view!=='pinned'||n.pinned)&&(activeFolder==='all'||n.folder===activeFolder)&&(!q||(n.title+' '+n.content+' '+n.folder).toLowerCase().includes(q)));list.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title,'de'):sort==='created'?new Date(b.created_at)-new Date(a.created_at):new Date(b.updated_at)-new Date(a.updated_at));$('#heading').textContent=view==='pinned'?'Angepinnt':activeFolder==='all'?'Alle Notizen':activeFolder;$('#notes').innerHTML=list.length?list.map(n=>'<article class="note" data-open="'+esc(n.id)+'"><h2>'+esc(n.title||'Ohne Titel')+'</h2><p>'+esc(n.content||'Noch kein Inhalt …')+'</p><div class="note-meta"><span class="tag">'+esc(n.folder)+'</span><span>'+dateLabel(n.updated_at)+'</span>'+(n.pinned?'<span class="pin" title="Angepinnt">★</span>':'')+'</div></article>').join(''):'<div class="empty"><strong>'+(q?'Keine Treffer':'Noch keine Notizen')+'</strong>'+(q?'Versuche einen anderen Suchbegriff.':'Erstelle deine erste Notiz und halte deine Gedanken fest.')+'</div>';$('#folders').innerHTML=folders.map(f=>'<button data-folder="'+esc(f)+'" class="'+(activeFolder===f?'active':'')+'">▱ &nbsp; '+esc(f)+'</button>').join('');$('#noteFolder').innerHTML=folders.map(f=>'<option value="'+esc(f)+'">'+esc(f)+'</option>').join('');document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openEditor(notes.find(n=>n.id===el.dataset.open)));document.querySelectorAll('[data-folder]').forEach(el=>el.onclick=()=>{activeFolder=el.dataset.folder;view='all';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));render()})}
function openEditor(n=null){editingId=n?.id||null;$('#editorTitle').textContent=n?'Notiz bearbeiten':'Neue Notiz';$('#noteTitle').value=n?.title||'';$('#noteContent').value=n?.content||'';$('#notePinned').checked=!!n?.pinned;$('#noteFolder').value=n?.folder||activeFolder!=='all'&&activeFolder||'Allgemein';$('#deleteNote').style.display=n?'block':'none';$('#editor').classList.add('open');$('#noteTitle').focus()}
function closeEditor(){$('#editor').classList.remove('open');editingId=null;$('#noteForm').reset()}
$('#newNote').onclick=()=>openEditor();$('#closeEditor').onclick=$('#cancelEditor').onclick=closeEditor;$('#editor').onclick=e=>{if(e.target===$('#editor'))closeEditor()};$('#noteForm').onsubmit=async e=>{e.preventDefault();const now=new Date().toISOString(),payload={owner:user.id,title:$('#noteTitle').value.trim(),content:$('#noteContent').value,folder:$('#noteFolder').value,pinned:$('#notePinned').checked,updated_at:now};if(!payload.title&&!payload.content.trim())return message('Bitte gib einen Titel oder Inhalt ein.');const btn=$('#noteForm button[type=submit]');btn.disabled=true;try{if(editingId){const{error}=await db.from('notes').update(payload).eq('id',editingId).eq('owner',user.id);if(error)throw error}else{const{error}=await db.from('notes').insert(payload);if(error)throw error}closeEditor();await loadNotes()}catch(err){alert('Die Notiz konnte nicht gespeichert werden: '+err.message)}finally{btn.disabled=false}};
$('#deleteNote').onclick=async()=>{if(!editingId||!confirm('Diese Notiz wirklich löschen?'))return;const{error}=await db.from('notes').delete().eq('id',editingId).eq('owner',user.id);if(error){alert('Löschen fehlgeschlagen: '+error.message);return}closeEditor();await loadNotes()};
$('#search').oninput=render;$('#sort').onchange=render;$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;activeFolder='all';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()};
$('#addFolder').onclick=()=>{const name=prompt('Name des neuen Ordners:');if(!name)return;const clean=name.trim().slice(0,30);if(!clean)return;if(folders.some(f=>f.toLowerCase()===clean.toLowerCase()))return alert('Dieser Ordner existiert bereits.');folders.push(clean);render();activeFolder=clean;render()};
$('#dashboard').onclick=()=>location.href='https://kotzschfelix-sudo.github.io/MyDigital/';
function signedOut(){user=null;notes=[];folders=['Allgemein','Privat','Arbeit','Ideen'];document.body.classList.add('auth-required')}
async function start(){const{data:{session}}=await db.auth.getSession();if(!session){signedOut();return}user=session.user;document.body.classList.remove('auth-required');$('#userBox').innerHTML='Angemeldet · '+esc(user.user_metadata?.username||user.email)+'<button id="logout">Abmelden</button>';$('#logout').onclick=async()=>{await db.auth.signOut();signedOut()};try{await loadNotes()}catch(e){$('#notes').innerHTML='<div class="empty"><strong>Notizen konnten nicht geladen werden</strong>'+esc(e.message)+'</div>'}}
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN')start();if(event==='SIGNED_OUT')signedOut()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
start();
</script>
</body></html>
